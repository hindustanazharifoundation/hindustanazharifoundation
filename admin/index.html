<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>HAF Admin</title>
<link rel="icon" href="../logo.jpg">
<link rel="stylesheet" href="admin.css">
</head><body>
<p class="card mut" id="cfgwarn" hidden>Firebase is not set up yet. Open <code>firebase-config.js</code> in the main folder and paste your config.</p>

<div id="app">
  <header><b>HAF Admin</b><span><a href="../index.html" target="_blank">View site</a></span></header>
  <main>
    <div class="tabs"><button class="t on" data-t="ph">Photos</button><button class="t" data-t="mem">Members</button></div>

    <section id="ph" class="card">
      <h2>Upload photos</h2>
      <label>Choose photos (you can select many)<input id="files" type="file" accept="image/*" multiple></label>
      <label>Caption (optional, applies to all selected)<input id="capt" type="text" maxlength="120"></label>
      <button id="up" class="b">Upload</button>
      <p class="msg" id="umsg"></p>
      <h2>Gallery photos</h2>
      <div id="plist" class="pgrid"></div>
    </section>

    <section id="mem" class="card" hidden>
      <h2>Add member</h2>
      <div class="row">
        <input id="nn" placeholder="Name">
        <select id="nt"><option value="member">Member</option><option value="founder">Founder</option></select>
        <input id="nr" placeholder="Role (founders only, e.g. President)">
        <input id="no" type="number" placeholder="Order" value="10">
        <button id="add" class="b">Add</button>
      </div>
      <p class="mut">Members show name only. Founders also show their role. Lower order number appears first.</p>
      <h2>Team</h2>
      <button id="seed" class="b s" hidden>Import current team list</button>
      <div id="mlist"></div>
      <p class="msg" id="mmsg"></p>
    </section>
  </main>
</div>
<script type="module" src="admin.js"></script>
</body></html>
